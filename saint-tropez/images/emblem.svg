<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 112" role="img" aria-label="Saint Tropez emblem">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dca6"/>
      <stop offset=".55" stop-color="#d1a95a"/>
      <stop offset="1" stop-color="#9c7530"/>
    </linearGradient>
    <radialGradient id="sun" cx=".45" cy=".7" r=".7">
      <stop offset="0" stop-color="#f6e3b4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#d1a95a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f8f8c"/>
      <stop offset="1" stop-color="#3cc0b5"/>
    </linearGradient>
    <path id="leaf" d="M0 0 C10 -9 26 -10 38 -2 C30 -4 22 -3 16 0 C24 -1 31 2 36 7 C24 2 12 2 0 0Z"/>
  </defs>
  <!-- sun disc + arc -->
  <circle cx="168" cy="58" r="40" fill="url(#sun)"/>
  <path d="M128 60 A40 40 0 0 1 208 60" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
  <!-- gulls -->
  <g fill="none" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round" transform="translate(-6 -6)">
    <path d="M150 40 q5 -5 9 0 q4 -5 9 0"/>
    <path d="M166 31 q4 -4 7 0 q3 -4 7 0"/>
    <path d="M178 46 q3.5 -3.5 6 0 q3 -3.5 6 0"/>
  </g>
  <!-- yacht -->
  <g transform="translate(0 -9)">
  <g fill="url(#g)">
    <path d="M142 74 L218 69 Q213 80 197 84 L156 84 Q147 81 142 74Z"/>
    <path d="M158 72 L204 69 L196 61 L170 61Z"/>
    <path d="M172 60 L193 59 L188 53 L178 53Z"/>
  </g>
  <path d="M164 67.5 L198 65.5" stroke="#0c1f1b" stroke-width="1.6" stroke-dasharray="4 2.5"/>
  </g>
  <!-- palm trunk -->
  <path d="M66 100 C70 82 73 62 80 42" fill="none" stroke="url(#g)" stroke-width="5.5" stroke-linecap="round"/>
  <g stroke="#9c7530" stroke-width=".8" fill="none" opacity=".7">
    <path d="M67 92 l6 1"/><path d="M69 82 l6 1"/><path d="M71 72 l6 1"/><path d="M74 62 l6 1"/><path d="M77 52 l5 1"/>
  </g>
  <!-- palm fronds -->
  <g transform="translate(80 40)" fill="url(#g)">
    <use href="#leaf" transform="rotate(-8)"/>
    <use href="#leaf" transform="rotate(28)"/>
    <use href="#leaf" transform="rotate(-48)"/>
    <use href="#leaf" transform="scale(-1 1) rotate(-8)"/>
    <use href="#leaf" transform="scale(-1 1) rotate(28)"/>
    <use href="#leaf" transform="scale(-1 1) rotate(-48)"/>
    <use href="#leaf" transform="rotate(-84) scale(.8)"/>
  </g>
  <circle cx="80" cy="42" r="3.2" fill="#9c7530"/>
  <!-- waves -->
  <path d="M14 100 C48 84 92 104 132 92 S200 76 232 70" fill="none" stroke="url(#t)" stroke-width="7" stroke-linecap="round"/>
  <path d="M30 108 C64 96 104 110 140 100 S196 88 226 82" fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round" opacity=".85"/>
</svg>
